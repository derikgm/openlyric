[package]
name = "openlyric"
version = "0.1.0"
description = "OpenLyric - Lyrics and Bible viewer (Tauri port)"
authors = ["Derik González Martín"]
edition = "2021"

[lib]
name = "openlyric_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
